name = "basketball-club-crm"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[[d1_databases]]
binding = "DB"
database_name = "bball-db"
database_id = "your-database-id-here" # Replace with your actual D1 database ID from Cloudflare
